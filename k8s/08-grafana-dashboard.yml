apiVersion: v1
kind: ConfigMap
metadata:
  name: bulletins-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bulletins.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{job=\"bulletins-app-metrics\"}[5m]))", "legendFormat": "RPS", "refId": "A" }],
          "title": "RPS (Requests per second)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [{ "expr": "sum(increase(http_server_requests_seconds_count{job=\"bulletins-app-metrics\", status=~\"5..\"}[5m])) or vector(0)", "legendFormat": "5xx", "refId": "A" }],
          "title": "HTTP 5xx Errors",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_sum{job=\"bulletins-app-metrics\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\"bulletins-app-metrics\"}[5m])), 0.000001)", "legendFormat": "Avg Latency", "refId": "A" }],
          "title": "Average HTTP Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [{ "expr": "sum(jvm_memory_used_bytes{job=\"bulletins-app-metrics\", area=\"heap\"})", "legendFormat": "JVM Heap", "refId": "A" }],
          "title": "JVM Heap Used",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "id": 5,
          "targets": [{ "expr": "sum(irate(process_cpu_seconds_total{job=\"bulletins-app-metrics\"}[1m])) or vector(0)", "legendFormat": "CPU", "refId": "A" }],
          "title": "Application CPU",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "id": 6,
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"bulletins\", pod=~\"bulletins-app-.*\"}[10m])) or vector(0)", "legendFormat": "Restarts", "refId": "A" }],
          "title": "Pod Restarts",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": [],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Bulletins App Observability",
      "uid": "bulletins-observability",
      "version": 1
    }