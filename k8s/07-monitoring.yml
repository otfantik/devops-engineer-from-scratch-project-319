apiVersion: v1
kind: Service
metadata:
  name: bulletins-app-metrics
  namespace: bulletins
  labels:
    app: bulletins
spec:
  type: ClusterIP
  selector:
    app: bulletins
  ports:
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bulletins-app
  namespace: bulletins
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - bulletins
  selector:
    matchLabels:
      app: bulletins
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      scheme: http
      interval: 30s
      scrapeTimeout: 10s