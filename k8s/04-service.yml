apiVersion: v1
kind: Service
metadata:
  name: bulletins-app
  namespace: bulletins
  labels:
    app: bulletins
spec:
  type: ClusterIP
  selector:
    app: bulletins
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 9090
      targetPort: management
      protocol: TCP