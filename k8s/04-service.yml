apiVersion: v1
kind: Service
metadata:
  name: bulletins-app
  namespace: bulletins
  labels:
    app: bulletins
  annotations:
    yandex.cloud/load-balancer-type: "external"
spec:
  type: LoadBalancer
  selector:
    app: bulletins
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: management
      port: 9090
      targetPort: management
      protocol: TCP