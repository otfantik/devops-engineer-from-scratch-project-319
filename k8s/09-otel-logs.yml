apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-logs-config
  namespace: monitoring
data:
  otel-collector.yaml: |
    receivers:
      filelog:
        include:
          - /var/log/containers/*bulletins-app*.log
        start_at: end
        include_file_path: true
        operators:
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) (?P<log>.*)$'
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: json_parser
            parse_from: attributes.log
            parse_to: body
          - type: move
            from: body.level
            to: attributes.level
          - type: move
            from: body.message
            to: body

    processors:
      resource:
        attributes:
          - key: service.name
            value: bulletins-app
            action: upsert
          - key: k8s.namespace.name
            value: bulletins
            action: upsert

    exporters:
      loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [resource]
          exporters: [loki]
      telemetry:
        metrics:
          level: normal